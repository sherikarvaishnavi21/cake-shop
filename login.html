<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sweet Delights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🍰 Sweet Delights</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-card" style="max-width: 400px; margin-top: 50px;">
            <h2>Welcome to Sweet Delights</h2>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">Please login or sign up to access our menu and order delicious cakes.</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="loginName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="loginEmail" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="loginPhone" required placeholder="+91 98765 43210">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login & Continue</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sweet Delights Bakery. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
